########################################################
### Mysql
########################################################
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/app_manager?useUnicode=true&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

########################################################
### Java Persistence Api
########################################################
# Specify the DBMS
spring.jpa.database = MYSQL
# Show or not log for each sql query
spring.jpa.show-sql = true
# Hibernate ddl auto (create, create-drop, update)
spring.jpa.hibernate.ddl-auto = update

# Naming strategy
spring.jpa.hibernate.naming-strategy = org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQL5InnoDBDialect

############################################################
#
# 上传文件大小
#
############################################################
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB
############################################################
#
# 自动清理过期安装包（org.yzr.task.CleanupScheduler）
#   走的是页面「清除」按钮同一个方法，口径一致：
#   未定版 + 早于阈值 + 非该 app 当前包 → 删除（连磁盘文件）
#   **点了「定版」的发版包永远不会被自动删** —— 这是短保留期能安全落地的前提
#   days 会被 cleanExpiredPackages 夹到 3~30
#
############################################################
app.cleanup.enabled=true
app.cleanup.days=7
app.cleanup.cron=0 0 3 * * *
############################################################
#
# ssl
#
############################################################
server.ssl.key-store=classpath:server.pkcs12
server.ssl.key-store-password=123456
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=1

# 自定义配置
server.port=8081
server.http.port=8082
config.debug=debug
server.domain=127.0.0.1