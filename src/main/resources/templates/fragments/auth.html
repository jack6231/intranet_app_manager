<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- 页面公共的 CSRF token：放在 <head> 靠前位置，会话在响应提交前创建（auth.js 读取后加到 ajax 请求头） -->
  <th:block th:fragment="meta">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  </th:block>
</head>
<body>
  <!-- 导航栏右侧：已登录显示账号 + 退出，未登录显示 登录 / 注册 -->
  <div th:fragment="bar" class="auth-bar">
    <th:block th:if="${currentUser != null}">
      <span class="auth-user" th:text="${currentUser}"></span>
      <form class="auth-logout" method="post" action="/logout">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="next" th:value="${currentPath}"/>
        <button type="submit">退出</button>
      </form>
    </th:block>
    <th:block th:if="${currentUser == null}">
      <a th:href="@{/login(next=${currentPath})}">登录</a>
      <a th:href="@{/register(next=${currentPath})}">注册</a>
    </th:block>
  </div>

  <!-- 登录弹窗：未登录时点删除 / 上传 App Store 弹出，登录成功后接着执行刚才的操作（static/js/auth.js） -->
  <div th:fragment="loginModal" id="login-modal" class="login-modal">
    <div class="login-modal-backdrop" data-login-close></div>
    <div class="auth-card login-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="login-modal-title">
      <button type="button" class="login-modal-close" data-login-close aria-label="关闭">&times;</button>
      <h2 id="login-modal-title">登录</h2>
      <p class="auth-hint">删除和上传 App Store 需要登录，操作会记录到账号名下。</p>
      <p class="auth-error login-modal-error"></p>
      <form id="login-modal-form">
        <input class="form-control" name="username" placeholder="用户名" autocomplete="username" required/>
        <input class="form-control" name="password" type="password" placeholder="密码" autocomplete="current-password" required/>
        <label class="auth-remember"><input type="checkbox" name="remember-me" checked/> 30 天内自动登录</label>
        <button class="btn btn-primary btn-block" type="submit">登录</button>
        <p class="auth-switch">还没有账号？<a th:href="@{/register(next=${currentPath})}">注册</a></p>
      </form>
    </div>
  </div>
</body>
</html>
